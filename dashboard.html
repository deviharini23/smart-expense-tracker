<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
      color: #333;
    }
    .dark-mode {
      background: #121212;
      color: #fff;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }
    .dark-mode .container {
      background: #1e1e1e;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
    }
    button:hover {
      background: #45a049;
    }
    .expense-list {
      margin-top: 20px;
    }
    .expense-item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: #eee;
      margin: 5px 0;
      border-radius: 6px;
    }
    .dark-mode .expense-item {
      background: #333;
    }
    .charts {
      margin-top: 30px;
    }
    .motivation {
      margin-top: 20px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Expense Dashboard</h1>
    <button onclick="toggleDarkMode()">🌙 Toggle Dark/Light</button>
    
    <h3>Set Budget and Savings</h3>
    <input type="number" id="budgetInput" placeholder="Enter Total Salary/ Budget">
    <input type="number" id="savingInput" placeholder="Enter Desired Savings">
    <button onclick="setBudget()">Set</button>
    
    <h3>Add Expense</h3>
    <input type="text" id="expenseName" placeholder="Expense Name">
    <input type="number" id="expenseInput" placeholder="Enter Expense Amount">
    <button onclick="addExpense()">Add Expense</button>
    <button onclick="addDefaultExpenses()">+ Suggest Default Expenses</button>
    
    <div class="expense-list" id="expenseList"></div>
    
    <h3>Summary</h3>
    <p id="summary"></p>
    <button onclick="nextMonth()">➡️ Next Month</button>
    
    <div class="charts">
      <canvas id="expenseChart" width="400" height="200"></canvas>
    </div>
    
    <p class="motivation" id="motivation"></p>
  </div>

  <script>
    let budget = 0;
    let desiredSavings = 0;
    let expenses = [];
    let months = [];
    let monthData = [];
    let currentMonth = 1;
    let chart;

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    function setBudget() {
      budget = parseFloat(document.getElementById("budgetInput").value) || 0;
      desiredSavings = parseFloat(document.getElementById("savingInput").value) || 0;
      expenses = [];
      document.getElementById("expenseList").innerHTML = "";
      updateSummary();
    }

    function addExpense() {
      let name = document.getElementById("expenseName").value.trim();
      let value = parseFloat(document.getElementById("expenseInput").value) || 0;

      if (!name) {
        alert("Please enter expense name");
        return;
      }

      if (budget === 0) {
        alert("Please set budget first");
        return;
      }

      let totalExpenses = expenses.reduce((a, b) => a + b.amount, 0) + value;
      if (totalExpenses > (budget - desiredSavings)) {
        alert("⚠️ Expense exceeds allowed limit! Carrying to next month.");
        return;
      }

      expenses.push({ name: name, amount: value });
      displayExpenses();
      updateSummary();
    }

    function addDefaultExpenses() {
      if (budget === 0) {
        alert("⚠️ Please set budget first.");
        return;
      }
      const defaults = [
        { name: "Rent", amount: budget * 0.3 },
        { name: "Food", amount: budget * 0.2 },
        { name: "Travel", amount: budget * 0.1 },
        { name: "Utilities", amount: budget * 0.15 },
        { name: "Entertainment", amount: budget * 0.1 }
      ];
      expenses.push(...defaults);
      displayExpenses();
      updateSummary();
    }

    function displayExpenses() {
      let list = document.getElementById("expenseList");
      list.innerHTML = "";
      expenses.forEach((exp, index) => {
        let div = document.createElement("div");
        div.classList.add("expense-item");
        div.innerHTML = `
          <span>${exp.name}: ₹${exp.amount.toFixed(2)}</span>
          <button onclick="removeExpense(${index})">❌</button>
        `;
        list.appendChild(div);
      });
    }

    function removeExpense(index) {
      expenses.splice(index, 1);
      displayExpenses();
      updateSummary();
    }

    function updateSummary() {
      let totalExpenses = expenses.reduce((a, b) => a + b.amount, 0);
      let remaining = budget - totalExpenses - desiredSavings;
      document.getElementById("summary").innerText = 
        `Budget: ₹${budget}, Savings Goal: ₹${desiredSavings}, 
         Used: ₹${totalExpenses}, Remaining: ₹${remaining}`;
    }

    function nextMonth() {
      let totalExpenses = expenses.reduce((a, b) => a + b.amount, 0);
      let actualSavings = budget - totalExpenses;

      months.push("Month " + currentMonth);
      monthData.push({ used: totalExpenses, saved: actualSavings });

      updateChart();

      if (actualSavings >= desiredSavings) {
        document.getElementById("motivation").innerText = "🎉 Well done! You saved more this month!";
      } else {
        document.getElementById("motivation").innerText = "⚠️ Try to save more next month!";
      }

      currentMonth++;
      expenses = [];
      document.getElementById("expenseList").innerHTML = "";
      updateSummary();
    }

    function updateChart() {
      let labels = months;
      let usedData = monthData.map(d => d.used);
      let savedData = monthData.map(d => d.saved);

      if (chart) chart.destroy();

      chart = new Chart(document.getElementById("expenseChart"), {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            {
              label: "Used",
              data: usedData,
              backgroundColor: "tomato"
            },
            {
              label: "Saved",
              data: savedData,
              backgroundColor: "green"
            }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: "top" }
          }
        }
      });
    }
  </script>
</body>
</html>
